[project]
name = "msa"
version = "0.1.0"
description = "Memory Sparse Attention (MSA) continual pre-training on top of MiniMind"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers==4.57.6",
    "datasets==3.6.0",
    "numpy>=1.26,<2",
    "tokenizers>=0.20",
    "jinja2>=3.1",
    "tqdm",
    "swanlab",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa"]
